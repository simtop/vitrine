name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :vitrine-processor:test

      # The real end-to-end gate: runs the processor over the sample module's annotated
      # composables and compiles the generated code against real Compose. Bad imports,
      # unresolved members or invalid class names fail here, not in a consumer's project.
      - name: End-to-end code generation
        run: ./gradlew :sample:assembleRelease

      - name: Assemble published artifacts
        run: ./gradlew :vitrine-annotations:assembleRelease :vitrine-processor:assemble

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '**/build/reports/'
          if-no-files-found: ignore
