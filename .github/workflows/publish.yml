name: Publish

# Publishes both artifacts to Maven Central when a version tag is pushed, e.g. v0.1.0.
# The version comes from the tag, so there is no manual bump in gradle.properties.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Verify before publishing
        run: ./gradlew :vitrine-processor:test :sample:assembleRelease

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        # Uploads a staged deployment to the Central Portal. Releasing it is a manual click in
        # the Portal UI for the first release; swap to publishAndReleaseToMavenCentral once the
        # pipeline has proven itself.
        run: ./gradlew publishToMavenCentral -Pversion=${{ env.RELEASE_VERSION }}
