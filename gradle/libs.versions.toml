[versions]
kotlin = "2.4.0"
ksp = "2.3.9"
agp = "9.2.1"
kotlinpoet = "2.3.0"
composeBom = "2026.06.01"
mavenPublish = "0.30.0"
junit5 = "6.1.1"
compileSdk = "37"
# The published annotations AAR touches no Android API, so it keeps the lowest floor Compose
# supports. minSdk is only the sample module's own floor.
minSdkLibrary = "21"
minSdk = "28"

[libraries]
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlinpoet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinpoet" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit5" }

[plugins]
# No kotlin-android alias on purpose: AGP 9 has built-in Kotlin compilation, and
# applying org.jetbrains.kotlin.android on top of it breaks the built-in wiring.
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
